[package]
name = "indie-library"
version = "0.1.0"
edition = "2021"
authors = ["YeohGames"]
description = "Application de bureau pour la gestion et le lancement de jeux vidéo indépendants"

[dependencies]
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
trash = "5.2"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"

[build-dependencies]
slint-build = "1.9"