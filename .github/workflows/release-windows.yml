name: Build Windows Executable (.exe)

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Compile Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Verify executable generated
        shell: pwsh
        run: |
          if (Test-Path "target/release/indie-library.exe") {
            Write-Host "Success: indie-library.exe generated successfully!" -ForegroundColor Green
            Get-Item "target/release/indie-library.exe" | Format-List FullName, Length, LastWriteTime
          } else {
            Write-Error "target/release/indie-library.exe not found!"
            exit 1
          }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: indie-library-windows-x64
          path: target/release/indie-library.exe
          if-no-files-found: error
          retention-days: 14
