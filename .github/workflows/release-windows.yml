name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build-windows:
    name: Compile Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Verify executable generated
        shell: pwsh
        run: |
          if (Test-Path "target/release/indie-library.exe") {
            Write-Host "Success: indie-library.exe generated successfully!" -ForegroundColor Green
            Get-Item "target/release/indie-library.exe" | Format-List FullName, Length, LastWriteTime
          } else {
            Write-Error "target/release/indie-library.exe not found!"
            exit 1
          }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: indie-library-windows-x64
          path: target/release/indie-library.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/indie-library.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
